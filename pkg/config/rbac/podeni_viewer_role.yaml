# permissions for end users to view podenis.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podeni-viewer-role
rules:
- apiGroups:
  - network.msxf.com
  resources:
  - podenis
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - network.msxf.com
  resources:
  - podenis/status
  verbs:
  - get
