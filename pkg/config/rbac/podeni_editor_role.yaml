# permissions for end users to edit podenis.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podeni-editor-role
rules:
- apiGroups:
  - network.msxf.com
  resources:
  - podenis
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - network.msxf.com
  resources:
  - podenis/status
  verbs:
  - get
