kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: podenis.network.msxf.com
spec:
  group: network.msxf.com
  names:
    kind: PodENI
    listKind: PodENIList
    plural: podenis
    singular: podeni
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.eni.id
      name: ENIID
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .spec.eni.ipAddress
      name: IP
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: PodENI is the Schema for the podenis API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodENISpec defines the desired state of PodENI
            properties:
              eni:
                properties:
                  description:
                    type: string
                  gatewayIP:
                    type: string
                  id:
                    type: string
                  ipAddress:
                    type: string
                  macAddress:
                    type: string
                  name:
                    type: string
                  podCidr:
                    type: string
                  securityGroups:
                    items:
                      type: string
                    type: array
                  serviceCidr:
                    type: string
                type: object
              nodeIP:
                type: string
            required:
            - eni
            type: object
          status:
            description: PodENIStatus defines the observed state of PodENI
            properties:
              ecsId:
                type: string
              nodeName:
                type: string
              phase:
                description: |-
                  INSERT ADDITIONAL STATUS FIELD - define observed state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                type: string
              workLoad:
                type: string
