        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lira-controller
  namespace: kube-system
  labels:
    control-plane: lira-controller
spec:
  selector:
    matchLabels:
      control-plane: lira-controller
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: lira-controller
      labels:
        control-plane: lira-controller
    spec:
      hostNetwork: true
      containers:
      - command:
        - /lira-controller
        args:
        - --leader-elect
        - --open-api-url=http://gc-vpc-portal.msxfcloud.svc:8080
        image: lira-controller:latest
        name: lira-controller
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: lira-sa
      terminationGracePeriodSeconds: 10
      nodeSelector:
        node-role.kubernetes.io/control-plane:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lira-daemon
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: lira-daemon
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: lira-daemon
    spec:
      priorityClassName: system-node-critical
      hostNetwork: true
      tolerations:
        - operator: "Exists"
      serviceAccountName: lira-sa
      initContainers:
        - name: install-cni
          image: harborxy.msxfcloud.test/base/lira-cni:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - /install-cni.sh
          volumeMounts:
            - name: host-usr
              mountPath: /usr
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-etc
              mountPath: /etc/cni/net.d/
            - name: cni-lira
              mountPath: /opt/cni/lira
      containers:
        - name: lira-daemon
          image: harborxy.msxfcloud.test/base/lira-daemon:latest
          imagePullPolicy: Always
          command:
            - "/lira-daemon"
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - BPF
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: bpf-fs
              mountPath: /sys/fs/bpf
      volumes:
        - name: host-usr
          hostPath:
            path: /usr
            type: "Directory"
        - name: var-run
          hostPath:
            path: /var/run/
            type: "Directory"
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: "Directory"
        - name: cni-etc
          hostPath:
            path: /etc/cni/net.d
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cni-lira
          hostPath:
            path: /opt/cni/lira
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lira-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lira-role
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/exec
      - namespaces
      - nodes
      - configmaps
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
    - network.msxf.com
    resources:
    - podenis
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - network.msxf.com
    resources:
    - podenis/finalizers
    verbs:
    - update
  - apiGroups:
    - network.msxf.com
    resources:
    - podenis/status
    verbs:
    - get
    - patch
    - update
  - apiGroups:
      - ""
      - networking.k8s.io
      - apps
      - extensions
    resources:
      - networkpolicies
      - services
      - services/status
      - endpoints
      - statefulsets
      - daemonsets
      - deployments
      - deployments/scale
    verbs:
      - create
      - delete
      - update
      - patch
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lira-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lira-role
subjects:
- kind: ServiceAccount
  name: lira-sa
  namespace: kube-system
